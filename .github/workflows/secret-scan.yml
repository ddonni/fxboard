name: Secret scan

# 카드 2 (T04-C11): push/PR마다 저장소 전체 + git 기록에서 비밀값 패턴을 검색한다.
# scripts/check_secrets.py가 무언가 찾으면 exit code 1을 반환해 이 워크플로가 실패하고,
# 그 시점에 비밀키가 코드에 들어갔다는 걸 바로 알 수 있다 (사후 발견이 아니라 사전 차단).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (전체 히스토리 포함)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run secret scanner
        run: python3 scripts/check_secrets.py
