name: Collect JPY/KRW rate

on:
  schedule:
    # 매일 15:10 UTC = 00:10 KST (Asia/Seoul, UTC+9) — 자정 이후 그날의 실제 값을 기록한다
    - cron: "10 15 * * *"
  workflow_dispatch:
    inputs:
      failure_type:
        description: "실패 재생 유형 (none이면 실제 수집을 실행)"
        required: true
        type: choice
        default: "none"
        options:
          - none
          - timeout
          - http_4xx
          - http_5xx
          - malformed
          - empty

permissions:
  contents: write

concurrency:
  group: collect-rate
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily collection
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.failure_type == 'none' }}
        run: python3 scripts/collect_rate.py

      - name: Run failure replay
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_type != 'none' }}
        run: python3 scripts/collect_rate.py --simulate "${{ inputs.failure_type }}"

      - name: Commit updated data
        env:
          EVENT_NAME: ${{ github.event_name }}
          FAILURE_TYPE: ${{ inputs.failure_type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/failure_replay.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FAILURE_TYPE" != "none" ]; then
            MSG="chore(data): replay failure ($FAILURE_TYPE)"
          else
            MSG="chore(data): update daily rate"
          fi
          git commit -m "$MSG"
          git push
